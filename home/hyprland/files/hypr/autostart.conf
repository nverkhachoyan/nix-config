exec-once = bash -lc '[ -x /usr/libexec/lxqt-policykit-agent ] && /usr/libexec/lxqt-policykit-agent'
exec-once = bash -lc 'command -v mako >/dev/null && mako'
exec-once = bash -lc 'command -v cliphist >/dev/null && command -v wl-paste >/dev/null && wl-paste --type text --watch cliphist store'
exec-once = bash -lc 'command -v cliphist >/dev/null && command -v wl-paste >/dev/null && wl-paste --type image --watch cliphist store'
exec-once = bash -lc 'command -v nm-applet >/dev/null && nm-applet --indicator'
exec-once = bash -lc 'command -v blueman-applet >/dev/null && blueman-applet'
exec-once = bash -lc 'command -v hypridle >/dev/null && hypridle'
exec-once = bash -lc 'command -v hyprsunset >/dev/null && hyprsunset'
exec-once = bash -lc 'command -v swayosd-server >/dev/null && swayosd-server'
exec-once = bash -lc 'command -v systemctl >/dev/null && systemctl --user start elephant.service walker-gapplication.service >/dev/null 2>&1 || true'
