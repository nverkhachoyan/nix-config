$activeBorderColor = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorderColor = rgba(595959aa)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    active_opacity = 1.00
    inactive_opacity = 1.00

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000088)
    }

    blur {
        enabled = true
        size = 12
        passes = 3
        vibrancy = 0.25
    }
}

animations {
    enabled = yes
    animation = windows, 1, 5, default, popin 85%
    animation = windowsOut, 1, 4, default, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = -1
    focus_on_activate = true
    vrr = 1
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = true
}

# --- Fixed Layer Rules for v0.51.1 ---

# waybar
layerrule = blur, waybar
layerrule = ignorealpha 0.0, waybar

# wofi
layerrule = blur, wofi
layerrule = ignorealpha 0.0, wofi

# walker
layerrule = blur, walker
layerrule = ignorealpha 0.0, walker

# wlogout
layerrule = blur, wlogout
layerrule = ignorealpha 0.0, wlogout

# mako
layerrule = blur, mako
layerrule = ignorealpha 0.0, mako

# swayosd
layerrule = blur, swayosd
layerrule = ignorealpha 0.0, swayosd
