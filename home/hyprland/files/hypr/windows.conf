# Keep common utility windows floating and centered.
windowrulev2 = suppressevent maximize, class:.*

# Utility windows (Float, Center, and Resize)
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = size 70% 70%, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# Opaque by default to avoid unintended transparency in apps (e.g., Chrome).
windowrulev2 = opacity 1.00 1.00, class:.*

# Apps allowed to use translucency/blur.
# Edit this regex list to control which apps get the glass effect.
windowrulev2 = opacity 0.97 0.92, class:^(kitty|Alacritty|com.mitchellh.ghostty)$

# Always keep these apps fully opaque (media + browsers + creative).
windowrulev2 = opacity 1.00 1.00, class:^(google-chrome|Google-chrome|chromium|Chromium|brave-browser|firefox|org.mozilla.firefox|Vivaldi-stable|zen|zen-browser|zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|imv)$

# No blur for browsers
windowrulev2 = noblur, class:^(google-chrome|Google-chrome|chromium|Chromium|brave-browser|firefox|org.mozilla.firefox|Vivaldi-stable|zen|zen-browser)$
