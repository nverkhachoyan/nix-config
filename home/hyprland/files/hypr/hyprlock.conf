source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $font_color
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgb(9ca3af)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    check_color = $check_color
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}
