# Keep common utility windows floating and centered.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = utility-windows
    match:class = ^(pavucontrol|blueman-manager|nm-connection-editor)$
    float = true
    center = true
    size = 70% 70%
}

# Opaque by default to avoid unintended transparency in apps (e.g. Chrome).
windowrule {
    name = opaque-default
    match:class = .*
    opacity = 1.00 1.00
}

# Apps allowed to use translucency/blur.
# Edit this regex list to control which apps get the glass effect.
windowrule {
    name = translucent-terminals
    match:class = ^(kitty|Alacritty|com.mitchellh.ghostty)$
    opacity = 0.97 0.92
}

# Always keep these apps fully opaque (media + browsers + creative).
windowrule {
    name = opaque-media-browsers
    match:class = ^(google-chrome|Google-chrome|chromium|Chromium|brave-browser|firefox|org.mozilla.firefox|Vivaldi-stable|zen|zen-browser|zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|imv)$
    opacity = 1.00 1.00
}

windowrule {
    name = no-blur-browsers
    match:class = ^(google-chrome|Google-chrome|chromium|Chromium|brave-browser|firefox|org.mozilla.firefox|Vivaldi-stable|zen|zen-browser)$
    no_blur = true
}
