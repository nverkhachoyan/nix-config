# Launchers and session controls
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, X, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-rotate.sh
bind = $mainMod CTRL SHIFT, W, exec, ~/.config/hypr/scripts/theme-wallpaper.sh --reapply
bind = $mainMod CTRL, I, exec, ~/.config/hypr/scripts/toggle-idle.sh
bind = $mainMod CTRL, COMMA, exec, ~/.config/hypr/scripts/toggle-dnd.sh
bind = $mainMod CTRL, N, exec, ~/.config/hypr/scripts/toggle-nightlight.sh
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Layout controls
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, P, togglesplit,

# Focus movement (vim + arrows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratch workspace
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# Mouse controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = CTRL, Print, exec, grim -g "$(slurp)" - | swappy -f -

# Clipboard manager
bind = $mainMod CTRL, V, exec, cliphist list | wofi --dmenu --prompt "Clipboard" | cliphist decode | wl-copy
bind = $mainMod CTRL SHIFT, V, exec, cliphist wipe

# Media and brightness keys
bindel = , XF86AudioRaiseVolume, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --output-volume raise; else wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+; fi'
bindel = , XF86AudioLowerVolume, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --output-volume lower; else wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; fi'
bindl = , XF86AudioMute, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --output-volume mute-toggle; else wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; fi'
bindl = , XF86AudioMicMute, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --input-volume mute-toggle; else wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; fi'
bindl = , XF86AudioPlay, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --playerctl play-pause; else playerctl play-pause; fi'
bindl = , XF86AudioNext, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --playerctl next; else playerctl next; fi'
bindl = , XF86AudioPrev, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --playerctl previous; else playerctl previous; fi'
bindel = , XF86MonBrightnessUp, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --brightness raise; else brightnessctl set +10%; fi'
bindel = , XF86MonBrightnessDown, exec, bash -lc 'if command -v swayosd-client >/dev/null; then swayosd-client --brightness lower; else brightnessctl set 10%-; fi'
